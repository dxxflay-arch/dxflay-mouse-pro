
name: Build DXFLAY MOUSE PRO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DXFLAY-MOUSE-PRO-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
